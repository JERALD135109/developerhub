# Copy to app-config.local.yaml and set the referenced environment variables.
proxy:
  endpoints:
    '/platform-api':
      target: http://localhost:8080
      changeOrigin: true
      credentials: require
      allowedHeaders: [Idempotency-Key]
      headers:
        X-Platform-Token: ${PLATFORM_API_TOKEN}
backend:
  auth:
    externalAccess:
      - type: static
        options:
          token: ${BACKSTAGE_CATALOG_TOKEN}
          subject: developerhub-platform
        accessRestrictions:
          - plugin: catalog
integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}
