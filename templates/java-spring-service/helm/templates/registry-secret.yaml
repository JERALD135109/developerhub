{{- if .Values.registrySecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.registrySecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ `{{ .dockerconfig }}` }}'
  data:
    - secretKey: dockerconfig
      remoteRef:
        key: {{ .Values.registrySecret.remoteKey | quote }}
{{- end }}
