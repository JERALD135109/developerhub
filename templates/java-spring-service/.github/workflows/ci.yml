name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Helm lint and render
        run: |
          helm lint helm
          helm template service helm --set image.tag=${GITHUB_SHA} > rendered.yaml
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.0.1
      - name: Enforce runtime guardrails
        run: |
          pip install PyYAML==6.0.2
          python - <<'PY'
          import json, yaml
          docs = list(yaml.safe_load_all(open('rendered.yaml')))
          deployments = [x for x in docs if x and x.get('kind') == 'Deployment']
          assert deployments, 'Missing deployment'
          for i, doc in enumerate(deployments):
              with open(f'deployment-{i}.json', 'w') as output: json.dump(doc, output)
          PY
          for file in deployment-*.json; do
            result=$(opa eval --format raw --data helm/guardrails.rego --input "$file" 'count(data.guardrails.deny)')
            test "$result" = 0 || { opa eval --data helm/guardrails.rego --input "$file" 'data.guardrails.deny'; exit 1; }
          done
      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.img.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
