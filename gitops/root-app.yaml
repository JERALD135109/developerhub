# Replace the owner and apply after configuring Argo CD private repository access.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-root-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_GITHUB_OWNER/hub-gitops
    targetRevision: main
    path: apps/dev
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
