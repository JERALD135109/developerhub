# Apply once: kubectl apply -f gitops/root-app.yaml
# Watches hub-gitops/apps/dev and creates every service Application found there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-root-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JERALD135109/hub-gitops
    targetRevision: main
    path: apps/dev
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
